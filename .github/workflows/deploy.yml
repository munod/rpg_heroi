# Deploy no GitHub Pages: o jogo é 100% estático (sem build, sem npm) —
# a cada push na main a Actions roda o gate, empacota a raiz inteira
# (index.html, style.css, js/) e publica em https://munod.github.io/rpg_heroi/
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:      # roda o gate em PRs (o build/deploy só acontece fora de PR)
  workflow_dispatch: # gatilho manual na aba Actions

jobs:
  # Gate obrigatório: nenhum deploy sai com teste vermelho. A suíte é o
  # único gate do projeto (`node testes/todos.js`) — ver AGENTS.md.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Sintaxe (node --check)
        run: |
          for f in js/*.js testes/*.js; do node --check "$f"; done
      - name: Gate
        run: node testes/todos.js

  # Empacota o site num artifact. Fica num JOB SEPARADO do deploy: o
  # deploy-pages lista o artifact pelo serviço de artifacts e, no mesmo
  # job, a consulta podia chegar antes da indexação (falha "Found 0
  # artifacts" observada em 2026-11-16). Com o job de build concluído
  # antes, o artifact existe quando o deploy começa.
  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # raiz do projeto: index.html + style.css + js/ (os PNGs de teste
      # seguem junto e são inofensivos; .git/.github são excluídos)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # nunca dois deploys concorrendo: o mais novo substitui o anterior
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - name: Publica
        id: deployment
        uses: actions/deploy-pages@v4
